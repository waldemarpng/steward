[project]
name = "steward-client"
version = "0.1.0"
description = "Load secrets from a steward broker into the process environment."
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/waldemarpng/steward"
Repository = "https://github.com/waldemarpng/steward"
Issues = "https://github.com/waldemarpng/steward/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
