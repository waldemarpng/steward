[project]
name = "steward"
version = "0.1.0"
description = "Local secrets broker: values are stored encrypted in SQLite, and an app can fetch only the secrets its grant allows."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "greenlet>=3.2.0",
    "nicegui>=3.18.0",
    "sqlalchemy>=2.1.6",
]

[project.urls]
Homepage = "https://github.com/waldemarpng/steward"
Repository = "https://github.com/waldemarpng/steward"
Issues = "https://github.com/waldemarpng/steward/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["steward-client"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.17.3",
    "steward-client",
    "ty>=0.0.95",
]

[tool.uv.sources]
steward-client = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
line-length = 140
indent-width = 4
src = ["steward", "steward-client/src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is set by the formatter
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["steward", "steward_client"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["steward", "steward-client", "tests"]
respect-ignore-files = true

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.terminal]
error-on-warning = true
output-format = "full"
